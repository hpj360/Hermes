[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.6.0"
description = "Hermes - Independent agent layer with inherited environment configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hermes Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]
content_team = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# M4: optional external memory backend (lazy-imported; not a core dependency).
mem0 = [
    "mem0ai>=0.1",
]

[project.scripts]
hermes = "hermes.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["skills/**", "_gen_report.py", "tmp*/**", ".*/**"]

[tool.ruff.lint]
# 只启用正确性关键规则（pyflakes + pycodestyle 基础）。其余规则
# （isort/UP/BLE/S/DTZ/RUF/SIM/PLW 等）在 ruff 0.5+ 升级后成为默认，
# 与存量代码不符，作为技术债记录在 ROADMAP.md 的 P1/P2，暂不启用。
select = ["F", "E4", "E7", "E9", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["hermes"]

[tool.coverage.report]
show_missing = true
