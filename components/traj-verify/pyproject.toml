[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-verify"
version = "0.1.0"
description = "Append-only dispatch trajectory log with a reconstruction invariant: every dispatched payload must be replayable byte-for-byte from disk (serialization round-trip gate), plus offline audit (seq gaps, request/result pairing, content hashes). Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "trajectory",
    "audit-log",
    "replay",
    "observability",
    "append-only",
    "agent-harness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
