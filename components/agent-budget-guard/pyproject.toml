[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-budget-guard"
version = "0.1.0"
description = "Three-layer token circuit breaker for multi-agent systems: per-agent token limit, per-role consecutive-failure skip, and loop-wide budget fuse. Prevents runaway token burn from a single agent, a failing role, or the whole loop. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "token-budget",
    "circuit-breaker",
    "cost-control",
    "multi-agent",
    "agent-harness",
    "finops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
